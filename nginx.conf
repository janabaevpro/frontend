# AR Виньетка: конфигурация nginx для собственного сервера.
# Положите файл в /etc/nginx/conf.d/ar-vinetka.conf (или sites-available),
# замените example.com и пути к сертификатам, затем: nginx -t && systemctl reload nginx
#
# Сертификат (бесплатно): certbot --nginx -d example.com
# Камера в браузере работает ТОЛЬКО по HTTPS.

# Сжатие. Положите в http { } или в этот файл на верхнем уровне conf.d.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types
  text/plain
  text/css
  application/javascript
  application/json
  application/manifest+json
  image/svg+xml
  application/octet-stream;   # targets.mind (mp4 сюда не входит)

# Если установлен модуль brotli, можно добавить:
# brotli on;
# brotli_comp_level 5;
# brotli_types text/plain text/css application/javascript application/json image/svg+xml application/octet-stream;

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/ar-vinetka;
    index index.html;

    sendfile on;
    tcp_nopush on;

    # Заголовки безопасности (на уровне server).
    # Внимание: add_header внутри location отменяет эти, поэтому в location ниже
    # кэш задаётся директивой expires, а не add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Типы файлов
    types {
        text/html                     html;
        text/css                      css;
        application/javascript        js;
        application/manifest+json     webmanifest;
        image/svg+xml                 svg;
        video/mp4                     mp4;
        application/octet-stream      mind;
    }

    # Страница и Service Worker: всегда проверять обновление
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location = /manifest.webmanifest {
        expires 1d;
    }

    location = /icon.svg {
        expires 7d;
    }

    # Код и стили: всегда проверять обновление (ETag)
    location /js/ {
        expires -1;
    }

    location /css/ {
        expires -1;
    }

    # Библиотеки с версией в имени файла: кэш на год
    location /assets/lib/ {
        expires 1y;
        access_log off;
    }

    # Метки: короткий кэш (при замене файла обновятся быстро)
    location = /assets/targets.mind {
        expires 1h;
    }

    # Видео: поддержка Range-запросов включена в nginx по умолчанию.
    # Если меняете видео под тем же именем, пользователи увидят новое через сутки.
    # Для вечного кэша называйте файлы с версией: video-1.v2.mp4
    location /assets/videos/ {
        expires 1d;
        access_log off;
        # Необязательно (нужен модуль ngx_http_mp4_module):
        # mp4;
        # mp4_buffer_size 1m;
        # mp4_max_buffer_size 5m;
    }

    location / {
        try_files $uri =404;
    }
}
